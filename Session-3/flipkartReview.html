<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms Assignment</title>
</head>

<body>

    <h1>Flipkart Product Review Form</h1>

    <form action="#" method="POST">

        <!-- Username -->
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" placeholder="Enter your username" required>
        <br><br>

        <!-- Rating -->
        <label for="rating">Rating:</label><br>
        <select id="rating" name="rating" required>
            <option value="" selected disabled>Select Rating</option>
            <option value="1">1 Star</option>
            <option value="2">2 Stars</option>
            <option value="3">3 Stars</option>
            <option value="4">4 Stars</option>
            <option value="5">5 Stars</option>
        </select>
        <br><br>

        <!-- Review -->
        <label for="review">Review:</label><br>
        <textarea id="review" name="review" rows="5" cols="40" placeholder="Write your review..." minlength="20"
            required></textarea>
        <br><br>

        <input type="submit" value="Submit Review">

    </form>

    <hr>

    <h1>Zomato Food Order Form</h1>

    <form action="#" method="POST">

        <!-- Order ID -->
        <!-- Disabled so users cannot edit the system-generated Order ID -->
        <label for="orderId">Order ID:</label><br>
        <input type="text" id="orderId" name="orderId" value="ORD12345" disabled>
        <br><br>

        <!-- Customer Name -->
        <label for="customerName">Customer Name:</label><br>
        <input type="text" id="customerName" name="customerName" required>
        <br><br>

        <!-- Food Item -->
        <label for="food">Food Item:</label><br>
        <select id="food" name="food" required>
            <option value="" selected disabled>Select Food Item</option>
            <option value="Pizza">Pizza</option>
            <option value="Burger">Burger</option>
            <option value="Biryani">Biryani</option>
        </select>
        <br><br>

        <!-- Quantity -->
        <label for="quantity">Quantity:</label><br>
        <input type="number" id="quantity" name="quantity" min="1" max="10" required>
        <br><br>

        <!-- Delivery Instructions -->
        <label for="instructions">Delivery Instructions:</label><br>
        <textarea id="instructions" name="instructions" rows="4" cols="40" placeholder="Enter delivery instructions..."
            required></textarea>
        <br><br>

        <input type="submit" value="Place Order">

    </form>

</body>

</html>
