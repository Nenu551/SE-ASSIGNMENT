<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Components Assignment</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- ================================================= -->
    <!-- Task 1 : Spotify Navbar -->
    <!-- ================================================= -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand" href="#">Spotify</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="#">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Playlists</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Profile</a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- ================================================= -->
    <!-- Task 2 : Flipkart Product Card -->
    <!-- ================================================= -->

    <div class="container my-5">

        <h2 class="text-center mb-4">Flipkart Product</h2>

        <div class="card mx-auto shadow" style="width:22rem;">

            <img src="https://via.placeholder.com/350x250" class="card-img-top" alt="Laptop">

            <div class="card-body">

                <h5 class="card-title">HP Pavilion Laptop</h5>

                <p class="card-text">
                    Intel Core i5 | 16GB RAM | 512GB SSD
                </p>

                <h4 class="text-success">₹54,999</h4>

                <button class="btn btn-primary">
                    Buy Now
                </button>

            </div>

        </div>

    </div>

    <!-- ================================================= -->
    <!-- Task 3 : BookMyShow Carousel -->
    <!-- ================================================= -->

    <div class="container my-5">

        <h2 class="text-center mb-4">Featured Movies</h2>

        <div id="movieCarousel" class="carousel slide" data-bs-ride="carousel">

            <div class="carousel-inner">

                <div class="carousel-item active">

                    <img src="https://via.placeholder.com/900x400?text=Movie+1" class="d-block w-100" alt="Movie 1">

                    <div class="carousel-caption d-none d-md-block">

                        <h5>Avengers: Endgame</h5>

                        <p>Action | Adventure</p>

                    </div>

                </div>

                <div class="carousel-item">

                    <img src="https://via.placeholder.com/900x400?text=Movie+2" class="d-block w-100" alt="Movie 2">

                    <div class="carousel-caption d-none d-md-block">

                        <h5>Spider-Man: No Way Home</h5>

                        <p>Action | Fantasy</p>

                    </div>

                </div>

                <div class="carousel-item">

                    <img src="https://via.placeholder.com/900x400?text=Movie+3" class="d-block w-100" alt="Movie 3">

                    <div class="carousel-caption d-none d-md-block">

                        <h5>Interstellar</h5>

                        <p>Sci-Fi | Drama</p>

                    </div>

                </div>

            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#movieCarousel" data-bs-slide="prev">

                <span class="carousel-control-prev-icon"></span>

            </button>

            <button class="carousel-control-next" type="button" data-bs-target="#movieCarousel" data-bs-slide="next">

                <span class="carousel-control-next-icon"></span>

            </button>

        </div>

    </div>

    <!-- ================================================= -->
    <!-- Task 4 : Zomato Review Form -->
    <!-- ================================================= -->

    <div class="container my-5">

        <h2 class="mb-4">Restaurant Review</h2>

        <form>

            <div class="mb-3">

                <label class="form-label">Name</label>

                <input type="text" class="form-control" placeholder="Enter your name">

            </div>

            <div class="mb-3">

                <label class="form-label">Rating</label>

                <select class="form-select">

                    <option>1 ⭐</option>
                    <option>2 ⭐⭐</option>
                    <option>3 ⭐⭐⭐</option>
                    <option>4 ⭐⭐⭐⭐</option>
                    <option>5 ⭐⭐⭐⭐⭐</option>

                </select>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Review
                </label>

                <textarea class="form-control" rows="4" placeholder="Write your review..."></textarea>

            </div>

            <button class="btn btn-success">
                Submit Review
            </button>

        </form>

    </div>

    <!-- ================================================= -->
    <!-- Task 5 : Filter Buttons -->
    <!-- ================================================= -->

    <div class="container my-5">

        <h2 class="mb-3">
            Food Filters
        </h2>

        <div class="btn-group">

            <button class="btn btn-outline-primary active">
                All
            </button>

            <button class="btn btn-outline-success">
                Veg
            </button>

            <button class="btn btn-outline-danger">
                Non-Veg
            </button>

            <button class="btn btn-outline-warning">
                Desserts
            </button>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
