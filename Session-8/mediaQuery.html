<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Flipkart Product Card</title>
    <link rel="stylesheet" href="mediaQuery.css">
</head>

<body>
    <div class="product-card">
        <div class="product-image">
            <img src="https://techterms.com/img/xl/laptop_586.png" alt="Laptop">
        </div>
        <div class="product-details">
            <h2>HP Pavilion Laptop</h2>
            <p>
                Intel Core i7 Processor<br>
                16GB RAM | 512GB SSD<br>
                Windows 11 Home
            </p>
            <p class="price">₹74,999</p>
            <button>Add to Cart</button>
        </div>
    </div>
</body>

</html>
