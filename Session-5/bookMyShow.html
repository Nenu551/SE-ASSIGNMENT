<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyShow Movie Page</title>

    <style>
        body {
            background-color: white;
            color: black;
            font-family: Arial, sans-serif;
            transition: 0.4s;
            padding: 30px;
        }

        .dark-mode {
            background-color: #121212;
            color: white;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #f84464;
            color: white;
        }

        button:hover {
            background-color: #d52d50;
        }

        .movie-card {
            margin-top: 30px;
            border: 1px solid gray;
            padding: 20px;
            border-radius: 10px;
        }
    </style>

</head>

<body>

    <h1>BookMyShow</h1>

    <button onclick="toggleMode()">
        Toggle Light/Dark Mode
    </button>

    <div class="movie-card">

        <h2>Avengers: Endgame</h2>

        <p>
            Genre: Action, Adventure
        </p>

        <p>
            Rating: ⭐ 4.8/5
        </p>

    </div>

    <script>

        function toggleMode() {
            document.body.classList.toggle("dark-mode");
        }

    </script>

</body>

</html>
