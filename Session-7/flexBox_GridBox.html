<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox & Grid Assignment</title>
    <link rel="stylesheet" href="flexBox.css">
</head>

<body>

    <!-- Task -1  -->

    <h1>Favourite Apps</h1>

    <div class="social-container">

        <img src="https://upload.wikimedia.org/wikipedia/commons/9/95/Instagram_logo_2022.svg" alt="Instagram">

        <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/WhatsApp_icon.png" alt="WhatsApp">

        <img src="https://static.vecteezy.com/system/resources/previews/020/336/004/non_2x/zomato-logo-zomato-icon-free-free-vector.jpg"
            alt="Zomato">

        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/19/Spotify_logo_without_text.svg/1280px-Spotify_logo_without_text.svg.png"
            alt="Spotify">

    </div>

    <!-- =====================================
     Task 2
===================================== -->

    <h1>Spotify Playlist</h1>
    <div class="playlist">
        <div class="song-card">
            <div>
                <strong>Believer</strong>
                <br>
                Imagine Dragons
            </div>
        </div>
        <div class="song-card">
            <div>
                <strong>Perfect</strong><br>
                Ed Sheeran
            </div>
        </div>
        <div class="song-card">
            <div>
                <strong>Blinding Lights</strong><br>
                The Weeknd
            </div>
        </div>
        <div class="song-card">
            <div>
                <strong>Shape of You</strong><br>
                Ed Sheeran
            </div>
        </div>
        <div class="song-card">
            <div>
                <strong>Levitating</strong><br>
                Dua Lipa
            </div>
        </div>
    </div>

    <!-- =====================================
     Task 3 & 4
===================================== -->

    <h1>Flipkart Product Grid</h1>
    <section class="product-grid">
        <div class="product-card">
            <img src="https://techterms.com/img/xl/laptop_586.png" alt="Laptop">
            <h3>Laptop</h3>
        </div>
        <div class="product-card">
            <img src="https://www.sony.co.in/image/2391ae5de6d0a34c41b28c03905f2ddc?fmt=png-alpha&resMode=bisharp&wid=384"
                alt="Mobile">
            <h3>Mobile</h3>
        </div>
        <div class="product-card">
            <img src="https://www.portronics.com/cdn/shop/files/Portronics_Muff_M3_best_headphones_under_5000.jpg?v=1744893854"
                alt="Headphones">
            <h3>Headphones</h3>
        </div>
        <div class="product-card">
            <img src="https://via.placeholder.com/200x180" alt="Smart Watch">
            <h3>Smart Watch</h3>
        </div>
        <div class="product-card">
            <img src="https://via.placeholder.com/200x180" alt="Camera">
            <h3>Camera</h3>
        </div>
        <div class="product-card">
            <img src="https://via.placeholder.com/200x180" alt="Speaker">
            <h3>Speaker</h3>
        </div>
    </section>
